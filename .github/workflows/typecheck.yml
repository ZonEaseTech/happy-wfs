name: Expo App TypeScript typecheck

on:
    pull_request:
        paths:
            - 'packages/happy-app/**'
            - '.github/workflows/typecheck.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/happy-app/**'
            - '.github/workflows/typecheck.yml'

jobs:
    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile
              # onnxruntime-node (happy-voice) otherwise downloads CUDA binaries whose
              # release asset now 404s; nothing built here needs the GPU build.
              env:
                ONNXRUNTIME_NODE_INSTALL_CUDA: skip

            - name: Build happy-wire
              run: yarn workspace happy-wire build

            - name: TypeScript typecheck
              run: yarn workspace happy-app typecheck
